<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R45 controlled evasion recorder</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #091721; color: #e8f5fc; font-family: system-ui, sans-serif; }
    #scene { position: absolute; inset: 0; }
    #scene canvas { display: block; width: 100%; height: 100%; }
    #fixture-label { position: absolute; top: 14px; left: 16px; padding: 8px 13px; border: 1px solid #e9ad5d; border-radius: 5px; background: #172733e8; color: #ffd39c; font-size: 13px; font-weight: 750; letter-spacing: .04em; }
    #panel { position: absolute; top: 58px; left: 16px; width: 360px; padding: 12px 14px; border: 1px solid #638096; border-radius: 7px; background: #0c1d2be8; box-shadow: 0 8px 24px #00101b88; line-height: 1.45; }
    #scenario { font-size: 19px; font-weight: 800; color: #fff; }
    #status { margin-top: 5px; min-height: 28px; font-size: 16px; font-weight: 800; color: #b4e9ff; }
    #status.warning { color: #ffb963; }
    #status.hit { color: #ff8585; }
    #details { margin-top: 7px; color: #c7d7e2; font-size: 13px; white-space: pre-line; }
    #progress { position: absolute; left: 0; bottom: 0; height: 5px; background: #64d7ff; width: 0; transition: width .08s linear; }
    #legend { position: absolute; right: 16px; bottom: 16px; padding: 7px 10px; border-radius: 4px; background: #091721d9; color: #d1e6f1; font-size: 12px; }
  </style>
</head>
<body>
  <div id="scene"></div>
  <div id="fixture-label">R45 / NORMAL CAMERA · CONTROLLED TEST FIXTURE · NOT A 100-MOUNT CLEAR</div>
  <section id="panel" aria-live="polite">
    <div id="scenario">starting browser fixture…</div>
    <div id="status">loading the production FlightScene</div>
    <div id="details"></div>
  </section>
  <div id="legend">Production FlightScene frames sampled every 10 fixed ticks during evasion; all simulation ticks are retained</div>
  <div id="progress"></div>
  <script type="module" src="./evasion-recorder.ts"></script>
</body>
</html>
