name: Deploy Gekichin to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Full main commit SHA approved for this deployment'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gekichin-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    env:
      LP_NUM_THREADS: '2'
    steps:
      - name: Verify requested revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Read existing Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: xvfb-run -a npm run test:browser
      - name: Read unchanged flight baseline for visual comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c0cf927fcf7dd75edae6fee539072e4b3498c86e
          path: .throttle-baseline
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix .throttle-baseline
      - run: node scripts/capture-throttle-comparison.mjs .throttle-baseline
      - name: Validate public files and record revision
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: node scripts/prepare-pages.mjs
      - name: Upload only the public build
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist
          retention-days: 7
      - name: Keep verification evidence separate from the public site
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-verification-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            dist/deployment.json
          retention-days: 14
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
